<!-- reserve/templates/reserve/booking_result.html -->
{% if error %}
    <!-- エラーが発生した場合の表示 -->
    <p style="color: #d9534f; font-weight: bold; margin-top: 10px;">
        {{ message }}
    </p>
{% else %}
    <!-- 予約が成功した場合の表示 -->
    <div style="background-color: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin-top: 10px; border: 1px solid #c3e6cb;">
        <h3 style="margin-top: 0; font-size: 1.2em;">✅ 予約が完了しました！</h3>
        <p style="margin-bottom: 5px;">
            <strong>サイト:</strong> {{ campsite.name }} （{{ tent_count }}張り / {{ plan_name }}）
        </p>
        <p style="margin-bottom: 5px;">
            <strong>期間:</strong> {{ check_in }} 〜 {{ check_out }}
        </p>
        <p style="margin-bottom: 0; font-size: 1.1em;">
            <strong>合計金額:</strong> <span style="font-weight: bold; color: #000;">{{ total_price }} 円</span>
        </p>
    </div>
{% endif %}
